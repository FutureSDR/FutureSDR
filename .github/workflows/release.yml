name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write

env:
  CARGO_TERM_COLOR: always

jobs:
  checks:
    name: Release checks
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  publish:
    name: Publish
    needs: checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@nightly

      - name: Install system dependencies
        run: |
          sudo apt-get -y update
          sudo apt-get -y install libasound2-dev libsoapysdr-dev libzmq3-dev

      - name: Authenticate with crates.io
        id: auth
        uses: rust-lang/crates-io-auth-action@v1

      - name: Publish crates to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"

          crate_is_published() {
            (cd "$RUNNER_TEMP" && cargo info --registry crates-io "$1@$version" >/dev/null 2>&1)
          }

          wait_for_crate() {
            crate="$1"

            for attempt in {1..30}; do
              if crate_is_published "$crate"; then
                return 0
              fi

              echo "Waiting for $crate $version to appear in the registry ($attempt/30)"
              sleep 10
            done

            echo "::error::$crate $version did not appear in the registry"
            exit 1
          }

          publish_and_wait() {
            manifest="$1"
            crate="$2"

            if crate_is_published "$crate"; then
              echo "$crate $version is already published"
              return 0
            fi

            cargo publish --manifest-path "$manifest"
            wait_for_crate "$crate"
          }

          publish_and_wait crates/futuredsp/Cargo.toml futuredsp
          publish_and_wait crates/macros/Cargo.toml futuresdr-macros
          publish_and_wait crates/types/Cargo.toml futuresdr-types

          publish_and_wait crates/remote/Cargo.toml futuresdr-remote

          publish_and_wait Cargo.toml futuresdr

          publish_and_wait crates/prophecy/Cargo.toml prophecy

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --verify-tag \
            --title "$GITHUB_REF_NAME" \
            --generate-notes

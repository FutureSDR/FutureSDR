[package]
name = "perf-wlan"
version = "0.1.0"
edition = "2024"

[workspace]

[dependencies]
clap = { version = "4", features = ["derive"] }
futuresdr = { path = "../..", default-features = false }
tracing = { version = "0.1", default-features = false, features = ["release_max_level_off"] }
wlan = { path = "../../examples/wlan/" }

[[bin]]
name = "rx"
path = "rx.rs"

[profile.release]
codegen-units = 1
debug = true
lto = true
opt-level = 3
panic = "abort"

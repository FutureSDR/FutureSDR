[package]
name = "perf-lora"
version = "0.1.0"
edition = "2024"

[workspace]

[dependencies]
anyhow = "1.0"
clap = { version = "4", features = ["derive"] }
core_affinity = "0.8"
futuresdr = { path = "../..", default-features = false }
lora = { path = "../../examples/lora" }
perf = { path = "../perf", default-features = false }
tracing = { version = "0.1", features = ["release_max_level_off"] }

[[bin]]
name = "rx"
path = "rx.rs"

[profile.release]
codegen-units = 1
debug = true
lto = true
opt-level = 3
panic = "abort"

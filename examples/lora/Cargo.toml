[package]
name = "lora"
version = "0.1.0"
edition = "2024"
readme = "./README.md"
license = "GPL-3.0-only"

[workspace]

[dependencies]
aes = "0.9"
anyhow = "1.0"
base64 = "0.22"
chrono = "0.4"
clap = { version = "4.6", features = ["derive"] }
ctr = "0.10"
futuredsp = { path = "../../crates/futuredsp" }
futuresdr = { path = "../..", features = ["seify", "soapy"] }
meshtastic = "0.1"
num-traits = "0.2"
rustfft = "6.4"
semtech-udp = { version = "0.12.0", features = ["client"] }
tokio = { version = "1", features = ["rt-multi-thread"] }
triggered = "0.1.3"
strum_macros = "0.28.0"
strum = "0.28.0"
rand = "0.10.1"
serde = { version = "1.0.228", features = ["derive"] }
regex = "1.12.4"

[package]
name = "spectrum"
version = "0.1.0"
edition = "2024"

[workspace]

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "cpu"

[features]
default = []
wgpu = ["futuresdr/wgpu"]


[[bin]]
name = "futuresdr_app"
path = "src/bin/web.rs"

[dependencies]
anyhow = "1.0"
futuresdr = { path = "../..", features = ["soapy"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"

[target.'cfg(target_arch = "wasm32")'.dependencies]
console_error_panic_hook = "0.1"
gloo-net = "0.7"
log = "0.4"
leptos = { version = "0.8", features = ["csr", "nightly"] }
prophecy = { path = "../../crates/prophecy" }
serde_json = "1.0"

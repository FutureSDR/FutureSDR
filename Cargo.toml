[package]
name = "futuresdr"
version.workspace = true
authors = ["FutureSDR Contributors <team@futuresdr.org>"]
edition = "2024"
# Minimum rustc version; FutureSDR currently requires the nightly channel (see rust-toolchain.toml).
rust-version = "1.95"
license = "Apache-2.0"
homepage = "https://www.futuresdr.org"
repository = "https://github.com/futuresdr/futuresdr/"
readme = "README.md"
description = "An Experimental Async SDR Runtime for Heterogeneous Architectures."
keywords = ["sdr", "radio", "runtime", "async", "acceleration"]
categories = [
    "asynchronous",
    "concurrency",
    "hardware-support",
    "science",
    "wasm",
]
exclude = [
    ".codex/",
    ".github/",
    "AGENTS.md",
    "book/",
    "check.sh",
    "config.toml",
    "perf/",
    "rust-analyzer.toml",
    "taplo.toml",
]

[workspace]
members = [
    ".",
    "crates/futuredsp",
    "crates/macros",
    "crates/prophecy",
    "crates/remote",
    "crates/types",
]

[workspace.package]
version = "0.6.0-dev"

[workspace.dependencies]
futuredsp = { path = "crates/futuredsp", version = "0.6.0-dev" }
futuresdr = { path = ".", version = "0.6.0-dev" }
futuresdr-macros = { path = "crates/macros", version = "0.6.0-dev" }
futuresdr-types = { path = "crates/types", version = "0.6.0-dev" }

[features]
default = ["ctrl_port", "tracing_max_level_debug", "tracing_release_max_level_info"]
aaronia_http = ["seify/aaronia_http"]
audio = ["dep:cpal", "dep:hound", "dep:rodio"]
burn = ["dep:burn"]
ctrl_port = ["dep:axum", "dep:hyper", "dep:tower-http", "dep:tower-service"]
flow_scheduler = ["dep:spin"]
hackrf = ["seify/hackrfone"]
hydrasdr = ["seify/hydrasdr"]
mocker = []
rtlsdr = ["seify/rtlsdr"]
seify = ["dep:seify", "futuresdr-types/seify"]
seify_dummy = ["seify/dummy"]
soapy = ["seify/soapy"]
tracing_max_level_debug = ["tracing/max_level_debug"]
tracing_release_max_level_info = ["tracing/release_max_level_info"]
wgpu = ["dep:wgpu"]
zeromq = ["dep:zmq"]

[[bench]]
name = "apply"
harness = false
required-features = ["mocker"]

[[bench]]
name = "flowgraph"
harness = false

[[bench]]
name = "sync_vs_async"
harness = false
required-features = ["mocker"]

[[example]]
name = "mock"
required-features = ["mocker"]

[[test]]
name = "flowgraph"
required-features = ["flow_scheduler"]

[[test]]
name = "mocker"
required-features = ["mocker"]

[[test]]
name = "moving_avg"
required-features = ["mocker"]

[[test]]
name = "seify"
required-features = ["seify_dummy"]

[dependencies]
anyhow = "1.0"
async-lock = "3.4"
async-trait = "0.1"
bytemuck = "1.25"
burn = { version = "0.21", default-features = false, optional = true }
config = "0.15"
dirs = "6.0"
dyn-clone = "1.0"
futures = "0.3"
futuredsp.workspace = true
futuresdr-macros.workspace = true
futuresdr-types.workspace = true
kanal = "0.1.1"
num-complex = { version = "0.4", features = ["bytemuck"] }
num-integer = "0.1"
once_cell = "1.21"
rustfft = "6.4"
seify = { version = "0.21", default-features = false, optional = true }
slab = "0.4"
spin = { version = "0.12", optional = true }
serde = { version = "1.0", features = ["derive"] }
thiserror = "2.0"
tracing = { version = "0.1", features = ["log"] }
web-time = { version = "1.1" }
wgpu = { version = "29.0", optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
async-task = "4.7"
concurrent-queue = { version = "2.5" }
console_error_panic_hook = "0.1"
cpal = { version = "0.18", optional = true, features = ['wasm-bindgen'] }
getrandom = { version = "0.4", features = ["wasm_js"] }
gloo-net = { version = "0.7", default-features = false, features = ["websocket"] }
gloo-timers = { version = "0.4", features = ["futures"] }
js-sys = "0.3"
rodio = { version = "0.22", default-features = false, optional = true }
tracing-wasm = "0.2"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
async-executor = "1.14"
async-fs = "2.2"
async-io = "2.6"
async-net = "2.0"
async-task = "4.7"
async-tungstenite = "0.34"
axum = { version = "0.8", default-features = false, features = [
    "form",
    "json",
    "matched-path",
    "original-uri",
    "query",
    "tower-log",
    "tracing",
], optional = true }
concurrent-queue = { version = "2.5" }
core_affinity = "0.8"
cpal = { version = "0.18", optional = true }
hound = { version = "3.5", optional = true }
rodio = { version = "0.22", default-features = false, features = [
    "symphonia-all",
], optional = true }
hyper = { version = "1", default-features = false, features = ["http1", "server"], optional = true }
tower-http = { version = "0.7", default-features = false, features = ["cors"], optional = true }
tower-service = { version = "0.3", default-features = false, optional = true }
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
vmcircbuffer = { version = "0.0.16", features = ["generic"] }
zmq = { version = "0.10", optional = true }

[target.'cfg(target_os = "android")'.dependencies]
tracing-android = "0.2"

[target.'cfg(target_arch = "wasm32")'.dependencies.web-sys]
version = "0.3"
features = [
    'Document',
    'Element',
    'HtmlElement',
    'Navigator',
    'Node',
    'Usb',
    'UsbConfiguration',
    'UsbControlTransferParameters',
    'UsbDevice',
    'UsbDeviceFilter',
    'UsbDeviceRequestOptions',
    'UsbInTransferResult',
    'UsbOutTransferResult',
    'UsbRecipient',
    'UsbRequestType',
    'UsbTransferStatus',
    'Window',
    'Worker',
    'WorkerGlobalScope',
    'WorkerNavigator',
    'WorkerOptions',
    'WorkerType',
]

[dev-dependencies]
criterion = { version = "0.8", features = ["html_reports"] }
float-cmp = "0.10"
rand = "0.10"
trybuild = "1.0"

[profile.release]
codegen-units = 1
debug = true
lto = "fat"
opt-level = 3
panic = "abort"

[package.metadata.docs.rs]
rustdoc-args = ["--cfg", "docsrs"]
